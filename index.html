<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiverse Perfect Version</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #e5e7eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 2rem 3rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        color: #cbd5e1;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>multiverse-perfect-version</h1>
      <p>A perfect version from the multiverse.</p>
      <p>
        Frontend demo: <a href="/">Open homepage</a><br />
        REST API: <a href="http://localhost:3000/api/health">/api/health</a>
      </p>
    </main>
  </body>
</html>
