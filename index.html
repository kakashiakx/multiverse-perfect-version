<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A perfect version from the multiverse." />
    <title>Multiverse Perfect Version</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: #e5e7eb;
        background: radial-gradient(ellipse at top, #1e3a8a, #0f172a 55%, #090e1b);
      }
      main {
        width: min(100%, 38rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid #334155;
        border-radius: 1.25rem;
        background: rgb(15 23 42 / 88%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 6vw, 2.6rem); }
      p { color: #cbd5e1; line-height: 1.6; }
      .status { padding: .8rem 1rem; border-radius: .75rem; background: #1e293b; }
      .controls { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
      input, button { min-height: 2.75rem; border-radius: .5rem; font: inherit; }
      input { flex: 1; min-width: 12rem; padding: 0 .8rem; color: inherit; background: #0f172a; border: 1px solid #475569; }
      button { padding: 0 1rem; color: #082f49; background: #7dd3fc; border: 0; cursor: pointer; font-weight: 700; }
      button:hover { background: #bae6fd; }
      a { color: #7dd3fc; }
      #greeting { min-height: 1.6em; }
    </style>
  </head>
  <body>
    <main>
      <h1>multiverse-perfect-version</h1>
      <p>A perfect version from the multiverse.</p>
      <p id="status" class="status" role="status" aria-live="polite">Checking API status…</p>
      <form id="hello-form">
        <label for="name">Get a greeting from the REST API</label>
        <div class="controls">
          <input id="name" name="name" maxlength="80" placeholder="Your name" />
          <button type="submit">Say hello</button>
        </div>
      </form>
      <p id="greeting" role="status" aria-live="polite"></p>
      <p>API endpoint: <a href="/api/health">/api/health</a></p>
    </main>
    <script>
      const status = document.querySelector('#status');
      const greeting = document.querySelector('#greeting');

      async function loadHealth() {
        try {
          const response = await fetch('/api/health');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          status.textContent = `API status: ${data.status} — ${data.message}`;
        } catch (error) {
          status.textContent = `API unavailable: ${error.message}`;
        }
      }

      document.querySelector('#hello-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = document.querySelector('#name').value.trim();
        const query = new URLSearchParams({ name });
        greeting.textContent = 'Loading…';
        try {
          const response = await fetch(`/api/hello?${query}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          greeting.textContent = data.message;
        } catch (error) {
          greeting.textContent = `Could not reach the API: ${error.message}`;
        }
      });

      loadHealth();
    </script>
  </body>
</html>
